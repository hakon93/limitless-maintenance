<style>
  :root { --bg: #050505; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: #ffffff;
    font-family: 'Jost', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 24px;
  }
  header { display: flex; justify-content: center; padding-top: 16px; }
  .logo { width: 230px; height: auto; display: block; }
  main {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 28px;
    max-width: 720px;
    padding: 48px 0;
  }
  .status {
    display: flex; align-items: center; gap: 10px;
    font-size: 12px; letter-spacing: 0.32em; margin-right: -0.32em;
    text-transform: uppercase; color: #9a9a9a;
  }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #ffffff;
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  h1 { margin: 0; font-size: 58px; font-weight: 200; line-height: 1.15; letter-spacing: 0.01em; }
  .rule { width: 48px; height: 1px; background: #3a3a3a; }
  p { margin: 0; font-size: 17px; font-weight: 300; line-height: 1.7; color: #b0b0b0; max-width: 480px; }
  footer { padding-bottom: 8px; font-size: 12px; font-weight: 300; letter-spacing: 0.08em; color: #6e6e6e; }
  @media (max-width: 600px) {
    h1 { font-size: 36px; }
    .logo { width: 180px; }
  }
</style>
